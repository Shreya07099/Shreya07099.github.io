<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shreya Nair</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="logo" href="#/" data-bind="name">Shreya Nair</a>
      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        Menu
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/blog" data-nav="blog">Blog</a>
        <a href="#/projects" data-nav="projects">Projects</a>
        <a href="#/mini" data-nav="mini">Mini projects</a>
        <a href="#/contact" data-nav="contact">Contact</a>
      </nav>
    </header>

    <main id="main">
      <div id="page-home" class="page">
        <section class="hero" aria-labelledby="hero-name">
          <p class="eyebrow" data-bind="role"></p>
          <h1 id="hero-name" data-bind="name"></h1>
          <p class="pitch" data-bind="pitch"></p>
          <div class="hero-actions">
            <a class="cta" href="#/" id="about-cta">About me</a>
            <a
              class="cta cta-quiet"
              href="Shreya_Nair_CV.pdf?v=2"
              target="_blank"
              rel="noopener noreferrer"
              >CV</a
            >
          </div>
        </section>

        <section id="about" class="section about" aria-labelledby="about-heading">
          <div class="section-head">
            <p class="eyebrow">What I do</p>
            <h2 id="about-heading">About</h2>
          </div>
          <div class="about-grid">
            <div id="about-copy" class="about-copy"></div>
            <ul id="skill-list" class="skill-list"></ul>
          </div>
        </section>
      </div>

      <div id="page-blog" class="page">
        <section class="section page-section" aria-labelledby="blog-heading">
          <div class="section-head">
            <p class="eyebrow">Writing</p>
            <h2 id="blog-heading">Blog</h2>
          </div>
          <div id="blog-list" class="blog-list"></div>
        </section>
      </div>

      <div id="page-post" class="page">
        <article class="article" aria-labelledby="post-title">
          <p class="back-row">
            <a href="#/blog">Back to blog</a>
          </p>
          <p class="eyebrow" id="post-eyebrow">Essay</p>
          <h1 id="post-title"></h1>
          <p class="post-meta" id="post-meta"></p>
          <div id="post-body" class="post-body"></div>
        </article>
      </div>

      <div id="page-projects" class="page">
        <section class="section page-section" aria-labelledby="work-heading">
          <div class="section-head">
            <p class="eyebrow">Selected work</p>
            <h2 id="work-heading">Projects</h2>
          </div>
          <div id="project-grid" class="project-grid"></div>
        </section>
      </div>

      <div id="page-mini" class="page">
        <section class="section page-section" aria-labelledby="mini-heading">
          <div class="section-head">
            <p class="eyebrow">Smaller studies</p>
            <h2 id="mini-heading">Mini projects</h2>
          </div>
          <div id="mini-grid" class="project-grid mini-grid"></div>
        </section>
      </div>

      <div id="page-contact" class="page">
        <section class="section page-section" aria-labelledby="contact-heading">
          <div class="section-head">
            <p class="eyebrow">Say hello</p>
            <h2 id="contact-heading">Contact</h2>
          </div>
          <p class="contact-lead" data-bind="contactLead"></p>
          <p class="contact-email">email: <span data-bind="email"></span></p>
          <ul id="social-list" class="social-list"></ul>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>
          <span data-bind="year"></span>
          <span data-bind="name"></span>
        </p>
        <ul id="footer-links" class="footer-links"></ul>
      </div>
    </footer>

    <script src="content.js?v=7"></script>
    <script src="blog.js?v=7"></script>
    <script src="script.js?v=7"></script>
  </body>
</html>
